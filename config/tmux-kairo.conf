# tmux-kairo.conf — config for the Kairo terminal seat (loaded only by kairo-term.sh,
# which runs tmux on its own private socket, so this never touches any other tmux).

# ── Terminal fidelity ─────────────────────────────────────────────────────────────
# Both TUIs (Claude Code, omp) need true colour + modified keys to render and bind
# correctly through tmux. omp's docs name extended-keys + allow-passthrough explicitly:
# extended-keys for Shift/Ctrl-modified keys, passthrough for its OSC notifications.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g extended-keys on
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on
set -g escape-time 10          # fast Esc — both TUIs use Esc to interrupt
set -g focus-events on

# ── Phone-friendly ────────────────────────────────────────────────────────────────
set -g mouse on                # tap to switch windows, swipe to scroll on a phone
set -g history-limit 50000     # long agent transcripts
set -g aggressive-resize on    # a phone and a laptop attached at once don't fight over size
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Status line: which harness, which chats, nothing else ─────────────────────────
set -g status-interval 30
set -g status-left "#[bold] kairo:#{session_name} #[default]"
set -g status-left-length 30
set -g status-right "#{?client_prefix,[prefix] ,}%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[reverse] #I:#W #[default]"
